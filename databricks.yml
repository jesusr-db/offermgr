bundle:
  name: coupons-offer-management

workspace:
  profile: DEFAULT

variables:
  catalog:
    default: main
  schema:
    default: coupon_mgmt

targets:
  dev:
    variables:
      catalog: main
      schema: coupon_mgmt
  prod:
    variables:
      catalog: dpz_prod
      schema: coupon_mgmt

resources:
  apps:
    coupons-app:
      name: coupons-offer-management
      description: "Coupon & Offer Management — DPZ POC demo"
      source_code_path: .
      config:
        command:
          - uvicorn
          - backend.main:app
          - --host=0.0.0.0
          - --port=8000
        env:
          - name: CATALOG
            value: ${var.catalog}
          - name: SCHEMA
            value: ${var.schema}
      permissions:
        - user_name: jesus.rodriguez@databricks.com
          level: CAN_MANAGE

sync:
  include:
    - "backend/**"
    - "frontend/dist/**"
    - "setup/**"
    - "app.yaml"
    - "requirements.txt"
