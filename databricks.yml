bundle:
  name: coupons-offer-management

workspace:
  profile: DEFAULT

variables:
  catalog:
    default: vdm_classic_rikfy0_catalog
  schema:
    default: coupon_mgmt
  warehouse_id:
    default: ""
    description: "SQL Warehouse ID used by the app"

targets:
  dev:
    variables:
      catalog: vdm_classic_rikfy0_catalog
      schema: coupon_mgmt
      warehouse_id: 708f9ebed64875ba
  aws:
    workspace:
      profile: aws
    variables:
      catalog: jmr_demo
      schema: coupon_mgmt
      warehouse_id: e9b34f7a2e4b0561

resources:
  jobs:
    seed-data:
      name: coupons-seed-data
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - faker>=24.0.0
      tasks:
        - task_key: seed
          spark_python_task:
            python_file: ${workspace.file_path}/setup/seed_data.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: serverless

  apps:
    coupons-app:
      name: coupons-offer-management
      description: "Coupon & Offer Management — DPZ POC demo"
      source_code_path: .
      permissions:
        - user_name: jesus.rodriguez@databricks.com
          level: CAN_MANAGE

sync:
  include:
    - "backend/**"
    - "frontend/dist/**"
    - "setup/**"
    - "app.yaml"
    - "requirements.txt"
